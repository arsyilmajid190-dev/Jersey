<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JERSEY STORE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#111;
}

/* HEADER */
header{
    background:#111;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
}

.cart-btn{
    background:white;
    color:#111;
    border:0;
    padding:10px 16px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#111,#333);
    color:white;
    padding:70px 6%;
    text-align:center;
}

.hero h1{
    font-size:48px;
    margin-bottom:12px;
}

.hero p{
    color:#ccc;
    font-size:17px;
}

/* SEARCH */
.controls{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;
    padding:14px 18px;
    border:1px solid #ddd;
    border-radius:30px;
    font-size:15px;
}

select{
    padding:14px 18px;
    border:1px solid #ddd;
    border-radius:30px;
    background:white;
}

/* PRODUCTS */
.products{
    max-width:1100px;
    margin:auto;
    padding:10px 20px 60px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
}

.product-img{
    width:100%;
    height:250px;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
}

.info{
    padding:16px;
}

.info h3{
    margin-bottom:8px;
}

.category{
    font-size:12px;
    color:#777;
    margin-bottom:10px;
}

.price{
    font-size:19px;
    font-weight:bold;
    margin-bottom:14px;
}

.add{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.add:hover{
    background:#333;
}

/* CART */
.cart{
    position:fixed;
    right:-420px;
    top:0;
    width:380px;
    max-width:90%;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:-5px 0 25px rgba(0,0,0,.25);
    transition:.3s;
    padding:25px;
    overflow-y:auto;
}

.cart.active{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:25px;
}

.close{
    border:none;
    background:none;
    font-size:25px;
    cursor:pointer;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #eee;
    padding:15px 0;
}

.qty button{
    border:1px solid #ddd;
    background:white;
    width:28px;
    height:28px;
    cursor:pointer;
}

.total{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
}

.checkout{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:30px;
}

/* RESPONSIVE */
@media(max-width:900px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .hero h1{
        font-size:35px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
        padding:10px 12px 40px;
    }

    .product-img{
        height:180px;
        font-size:50px;
    }

    .info{
        padding:12px;
    }

    .info h3{
        font-size:14px;
    }

    .price{
        font-size:15px;
    }

    .add{
        font-size:12px;
        padding:10px;
    }

    .cart{
        width:100%;
        max-width:100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">JERSEY STORE</div>

    <button class="cart-btn" onclick="openCart()">
        🛒 Keranjang <span id="cartCount">0</span>
    </button>
</header>

<section class="hero">
    <h1>JERSEY STORE</h1>
    <p>Temukan jersey favoritmu dengan gaya terbaik.</p>
</section>

<div class="controls">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Cari jersey..."
        oninput="renderProducts()"
    >

    <select id="category" onchange="renderProducts()">
        <option value="all">Semua Kategori</option>
        <option value="football">Football</option>
        <option value="basket">Basket</option>
        <option value="custom">Custom</option>
    </select>

</div>

<section class="products" id="products"></section>

<!-- CART -->
<div class="cart" id="cart">

    <div class="cart-header">
        <h2>Keranjang</h2>
        <button class="close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
        Total: Rp <span id="total">0</span>
    </div>

    <button class="checkout" onclick="checkout()">
        💬 Pesan via WhatsApp
    </button>

</div>

<footer>
    <p>© 2026 JERSEY STORE</p>
    <p>Football • Basketball • Custom Jersey</p>
</footer>

<script>

const products = [

{
    id:1,
    name:"Jersey Black Edition",
    price:150000,
    category:"football",
    image:"⚽"
},

{
    id:2,
    name:"Jersey Red Premium",
    price:175000,
    category:"football",
    image:"👕"
},

{
    id:3,
    name:"Jersey White Classic",
    price:145000,
    category:"football",
    image:"🏆"
},

{
    id:4,
    name:"Basket Jersey Black",
    price:160000,
    category:"basket",
    image:"🏀"
},

{
    id:5,
    name:"Basket Jersey White",
    price:160000,
    category:"basket",
    image:"🏀"
},

{
    id:6,
    name:"Custom Name Jersey",
    price:200000,
    category:"custom",
    image:"✨"
},

{
    id:7,
    name:"Jersey Streetwear",
    price:180000,
    category:"football",
    image:"🔥"
},

{
    id:8,
    name:"Custom Team Jersey",
    price:225000,
    category:"custom",
    image:"👕"
}

];

let cart = [];

function formatPrice(number){
    return new Intl.NumberFormat("id-ID").format(number);
}

function renderProducts(){

    const container = document.getElementById("products");

    const search =
        document.getElementById("search").value.toLowerCase();

    const category =
        document.getElementById("category").value;

    const filtered = products.filter(product => {

        const matchSearch =
            product.name.toLowerCase().includes(search);

        const matchCategory =
            category === "all" ||
            product.category === category;

        return matchSearch && matchCategory;

    });

    container.innerHTML = filtered.map(product => `

        <div class="card">

            <div class="product-img">
                ${product.image}
            </div>

            <div class="info">

                <div class="category">
                    ${product.category.toUpperCase()}
                </div>

                <h3>${product.name}</h3>

                <div class="price">
                    Rp ${formatPrice(product.price)}
                </div>

                <button
                    class="add"
                    onclick="addToCart(${product.id})">
                    + Tambah ke Keranjang
                </button>

            </div>

        </div>

    `).join("");

}

function addToCart(id){

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if(existing){
        existing.qty++;
    }else{
        cart.push({
            ...product,
            qty:1
        });
    }

    updateCart();

}

function updateCart(){

    const container =
        document.getElementById("cartItems");

    let total = 0;
    let count = 0;

    if(cart.length === 0){

        container.innerHTML =
            "<p>Keranjang masih kosong.</p>";

    }else{

        container.innerHTML = cart.map(item => {

            total += item.price * item.qty;
            count += item.qty;

            return `

            <div class="cart-item">

                <div>
                    <strong>${item.name}</strong>
                    <br>
                    Rp ${formatPrice(item.price)}
                </div>

                <div class="qty">

                    <button onclick="changeQty(${item.id},-1)">
                        −
                    </button>

                    ${item.qty}

                    <button onclick="changeQty(${item.id},1)">
                        +
                    </button>

                </div>

            </div>

            `;

        }).join("");

    }

    document.getElementById("total").textContent =
        formatPrice(total);

    document.getElementById("cartCount").textContent =
        count;

}

function changeQty(id, amount){

    const item = cart.find(p => p.id === id);

    if(!item) return;

    item.qty += amount;

    if(item.qty <= 0){
        cart = cart.filter(p => p.id !== id);
    }

    updateCart();

}

function openCart(){

    document
        .getElementById("cart")
        .classList.add("active");

}

function closeCart(){

    document
        .getElementById("cart")
        .classList.remove("active");

}

function checkout(){

    if(cart.length === 0){

        alert("Keranjang masih kosong!");

        return;

    }

    let message =
        "Halo JERSEY STORE, saya ingin memesan:%0A%0A";

    cart.forEach(item => {

        message +=
            "• " +
            item.name +
            " x" +
            item.qty +
            " - Rp " +
            formatPrice(item.price * item.qty) +
            "%0A";

    });

    const total =
        cart.reduce(
            (sum,item) =>
                sum + item.price * item.qty,
            0
        );

    message +=
        "%0ATotal: Rp " +
        formatPrice(total);

    /*
       GANTI NOMOR DI BAWAH
       dengan nomor WhatsApp toko kamu.
       Format: 628xxxxxxxxxx
    */

    const phone =
        "6285706743638";

    window.open(
        "https://wa.me/6285706743638" +
        phone +
        "?text=" +
        message,
        "hai makasih sudah order"
    );

}

renderProducts();
updateCart();

</script>

</body>
</html>
